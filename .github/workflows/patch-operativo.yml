name: Correcciones operativas
on:
  push:
    branches: [fix/cambios-camioneta-antes-devolucion]
    paths:
      - .github/workflows/patch-operativo.yml
      - scripts/parche_operativo.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cambios-camioneta-antes-devolucion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar ajustes
        run: python scripts/parche_operativo.py
      - name: Commit de corrección
        run: |
          git config user.name "reybaud-fix-bot"
          git config user.email "reybaud-fix-bot@users.noreply.github.com"
          git add src
          git diff --cached --quiet || (git commit -m "fix: arreglar camioneta y cambios pendientes" && git push)
