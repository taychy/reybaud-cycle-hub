name: Revisar interfaz
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependencias
        run: npm install --no-package-lock --legacy-peer-deps --no-audit --no-fund
      - name: Probar registro y verificación por email
        run: npm run test -- src/pages/Register.security.test.tsx src/lib/pendingOtp.registration.test.ts src/lib/portalPreference.registration.test.ts
      - name: Compilar
        run: npm run build
