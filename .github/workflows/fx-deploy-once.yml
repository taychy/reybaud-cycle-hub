name: Deploy finalized FX functions

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fx-deploy-once.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Supabase deployment access
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in this repository"
            exit 2
          fi

      - name: Deploy FX functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx --yes supabase@latest functions deploy get-current-fx --project-ref tgqfakfloonbunwkdoug
          npx --yes supabase@latest functions deploy create-event-mp-preference --project-ref tgqfakfloonbunwkdoug
          npx --yes supabase@latest functions deploy create-public-store-order --project-ref tgqfakfloonbunwkdoug
