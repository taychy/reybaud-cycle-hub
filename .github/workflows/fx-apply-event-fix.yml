name: Apply event FX persistence fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fx-apply-event-fix.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Apply targeted patch
        run: python3 .github/scripts/fix-event-fx-persist.py

      - name: Check diff
        run: git diff --check

      - name: Install dependencies without touching lockfile
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Typecheck
        run: npx tsgo --noEmit -p tsconfig.app.json

      - name: Build
        run: npm run build

      - name: Tests
        run: npx vitest run

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/EventCostSimulator.tsx
          git commit -m "fix: persist current FX in event budget"
          git push origin HEAD:main
