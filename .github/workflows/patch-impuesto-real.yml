name: Patch impuesto solo pagos reales

on:
  push:
    branches:
      - fix/impuesto-solo-pagos-reales
    paths:
      - .github/workflows/patch-impuesto-real.yml
      - .github/scripts/patch-impuesto-real.py

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/impuesto-solo-pagos-reales
          fetch-depth: 0

      - name: Apply targeted patch
        run: python3 .github/scripts/patch-impuesto-real.py

      - name: Check diff
        run: git diff --check

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/EventCostSimulator.tsx
          git commit -m "fix: aplicar impuesto solo a pagos reales bancarizados"
          git push origin HEAD:fix/impuesto-solo-pagos-reales
