name: Android release check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-release-check.yml'

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK and release AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Verify target SDK is 36
        run: |
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reybaud-android-api36
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
